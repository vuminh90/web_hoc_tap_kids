server {
    listen 80;

    # Nơi lưu trữ mã nguồn React đã build
    root /usr/share/nginx/html;
    index index.html;

    # Xử lý React Router (Tất cả đường dẫn không tồn tại trỏ về index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Không cache file index.html để trình duyệt luôn tải giao diện mới nhất
    location = /index.html {
        try_files $uri /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Proxy mọi request bắt đầu bằng /api sang container backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
